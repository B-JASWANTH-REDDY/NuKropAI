name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: Set up Python for test assertions
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python test requirements
      run: pip install requests psycopg2-binary

    - name: Run Backend Automated Tests
      run: npm test
      
    - name: Build Docker Image
      run: docker build -t ai-enterprise-backend .
