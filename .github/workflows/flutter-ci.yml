name: Flutter Enterprise CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]

jobs:
  flutter-quality-gate:
    name: "Flutter Verification & Build Quality Gate"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static Code Analysis (0 issues)
        run: flutter analyze

      - name: Execute Automated Widget & Unit Tests
        run: flutter test

      - name: Build Staging Debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.staging.nukropai.com/api/v1

