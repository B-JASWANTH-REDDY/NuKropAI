name: Automated Mandi Synchronization Engine

on:
  schedule:
    - cron: '30 0 * * *'   # 6:00 AM IST (00:30 UTC) - Morning Mandi Arrivals & Baseline
    - cron: '30 12 * * *'  # 6:00 PM IST (12:30 UTC) - Evening Closing Trade Observations
  workflow_dispatch:      # Manual trigger from GitHub Actions Console

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Codebase Clone Checkout
        uses: actions/checkout@v4

      - name: Setup Enterprise Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Architecture Requirements Modules
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      - name: Run Extraction Matrix Pipeline Tasks
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY || secrets.GOVT_API_KEY }}
          GOVT_API_KEY: ${{ secrets.GOVT_API_KEY || secrets.DATA_GOV_IN_API_KEY }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DB_CONNECTION_STRING }}
        run: python backend/mandi_pipeline_sync.py --agra
