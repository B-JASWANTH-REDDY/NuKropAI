apiVersion: v1
kind: ConfigMap
metadata:
  name: nukropai-backend-config
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-backend
    app.kubernetes.io/part-of: nukropai-platform
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://nukropai.com,https://app.nukropai.com"
  MAX_UPLOAD_SIZE_MB: "25"
  RATE_LIMIT_MAX: "120"
  RATE_LIMIT_TIME_WINDOW: "1 minute"
  OTEL_SERVICE_NAME: "nukropai-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"

