apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nukropai-backend-netpol
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-backend
    app.kubernetes.io/part-of: nukropai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nukropai-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from NGINX Ingress controller and internal Prometheus scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Redis internal connectivity within namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nukropai-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow external HTTPS egress (Supabase, Agmarknet, Groq Vision, OpenTelemetry)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
