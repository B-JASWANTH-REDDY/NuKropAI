apiVersion: apps/v1
kind: Deployment
metadata:
  name: nukropai-redis
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-redis
    app.kubernetes.io/part-of: nukropai-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nukropai-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nukropai-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: nukropai-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nukropai-redis-pvc
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-redis
    app.kubernetes.io/part-of: nukropai-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nukropai-redis-service
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-redis
    app.kubernetes.io/part-of: nukropai-platform
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: nukropai-redis
