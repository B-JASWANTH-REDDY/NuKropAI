# ==============================================================================
# NuKropAI Enterprise Backend — Kubernetes Secret Template (Sanitized)
# Instructions: Injected via SealedSecrets, HashiCorp Vault, or ExternalSecrets
# Authoritative naming matches backend/src/middleware/auth.ts and controllers
# NEVER COMMIT UNMASKED SECRETS TO SOURCE CONTROL
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nukropai-backend-secrets
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-backend
    app.kubernetes.io/part-of: nukropai-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:[REDACTED_PASSWORD]@[DB_HOST]:5432/postgres?sslmode=require"
  JWT_SECRET: "[GENERATE_32_BYTE_HEX_JWT_SECRET]"
  # Corrected variable name: backend requires JWT_REFRESH_SECRET
  JWT_REFRESH_SECRET: "[GENERATE_32_BYTE_HEX_REFRESH_SECRET]"
  # Authoritative JWT Audience and Issuer claims
  JWT_ISSUER: "nukrop-auth"
  JWT_AUDIENCE: "authenticated"
  SUPABASE_JWT_AUDIENCE: "authenticated"
  SUPABASE_JWT_SECRET: "[SUPABASE_JWT_SECRET]"
  SUPABASE_URL: "https://[PROJECT_REF].supabase.co"
  SUPABASE_ANON_KEY: "[SUPABASE_ANON_KEY]"
  SUPABASE_SERVICE_ROLE_KEY: "[SUPABASE_SERVICE_ROLE_KEY]"
  DATA_GOV_IN_API_KEY: "[DATA_GOV_IN_API_KEY]"
  GROQ_API_KEY: "[GROQ_AI_VISION_API_KEY]"
  REDIS_URL: "redis://nukropai-redis-service.nukropai.svc.cluster.local:6379"
