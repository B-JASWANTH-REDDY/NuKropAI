apiVersion: apps/v1
kind: Deployment
metadata:
  name: nukropai-worker
  namespace: nukropai
  labels:
    app.kubernetes.io/name: nukropai-worker
    app.kubernetes.io/part-of: nukropai-platform
    app.kubernetes.io/tier: background-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nukropai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nukropai-worker
        app.kubernetes.io/tier: background-worker
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: nukropai-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bullmq-worker
          image: ghcr.io/b-jaswanth-reddy/nukropai-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "-e", "require('./dist/workers/orchestrator').startOrchestrator()"]
          envFrom:
            - configMapRef:
                name: nukropai-backend-config
            - secretRef:
                name: nukropai-backend-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
